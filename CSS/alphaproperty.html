<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha</title>
    <style>
        h1{
            background-color: rgba(red, green, blue, 0.4);
        }
        div{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: rgb(120, 200, 100,0.8);
            transition: 2s;
            transition-delay: 1s;
            transition-timing-function: cubic-bezier(0.075, 0.82, 0.165, 1);
            transition-property: all;

        }
        div:hover{
            border-radius: 50%;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>Hi I m boy</h1>
    <div></div>
</body>
</html>
