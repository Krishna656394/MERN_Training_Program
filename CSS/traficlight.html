<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trafic_Light</title>
    <style>
        #outer{
            border: 2px double black;
            height: 200px;
            width: 70px; 
            background-color: aliceblue;
        }
        .inner{
            height: 50px;
            width: 50px;
            border: 2px solid black;
            border-radius: 50%;
            margin-left: 8px;
            margin-top: 8px;
        }
        #red{
            background-color: red;
        }
        #yellow{
            background-color: yellow;
        }
        #green{
            background-color: green;
        }
        .height{
            height: 300px;
            width: 10px;
            border: 2px solid aliceblue;
            background-color: black;
            margin-left: 30px;
        }
    </style>
</head>
<body>
    <div id="outer">
        <div class="inner" id="red">

        </div>
        <div class="inner" id="yellow">

        </div>
        <div class="inner" id="green">

        </div>
    </div>
    <div class="height">

    </div>
</body>
</html>
