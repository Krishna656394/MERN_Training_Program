<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="simpleCalc.css">
</head>
<body>
    <div class="cointainer">
        <h1>Simple Calculator</h1>
        <input type="text" name="" id="num1" value="" placeholder="Eneter 1st Number">
        <br>
        <input type="text" name="" id="num2" value="" placeholder="Enter 2nd Number">
        <br><br>
        
        <button id="add">Add(+)</button>
        <button id="sub">Sub(-)</button>
        <button id="mul">Multiply(*)</button>
        <button id="divi">Division(/)</button>
        <button id="mod">Modlus(%)</button>
        <button id="cls">Clear(X)</button>

        <br><br>
        <div><span id="result"></span></div>
    
    </div>
    <script src="simpleCalc.js"></script>
</body>
</html>
