    <h2>Registration Form</h2>
    <form action="" id="form">
    
        <label for="name">Name : </label>
        <input type="text" id="name" placeholder="Enter Name....">
        <br><br>
        <label for="email">Email : </label>
        <input type="text" placeholder="Enter Email..." id="email">
        <br><br>
        <label for="mono">Mobile No : </label>
        <input type="text" id="mono" placeholder="Mobile No ">
        <br><br>
        <label for="pwd">Password : </label>
        <input type="text" id="pwd" placeholder="Enter Password">
        <br><br>
        <label for="cpwd">Confirm Password : </label>
        <input type="text"  id="cpwd" placeholder="Enter Confirm Password.. ">
        <br><br>
        <label for="gen">Gender : </label>
        <input type="radio" name="" id="male">
        <label for="male">Male</label>
        <input type="radio" name="" id="female">
        <label for="female">Female</label>
        <br><br>
        <label for="Subject">Subject : </label>
        <input type="checkbox" id="java">
        <label for="java">Java</label>
        <input type="checkbox" id="c++">
        <label for="c++">C++</label>
        <input type="checkbox" id="js">
        <label for="js">JavaScript</label>
        <br><br>
        <label for="address">Address : </label>
        <input type="text" id="address" placeholder="Enter City ..">
        <br><br>
        <label for="pinCode">Pin Code : </label>
        <input type="text" id="pinCode">
        <br><br>
        <label for="country">Country : </label>
        <input type="text" id="country">
        <br><br>
        <label for="dob">DOB</label>
        <input type="text" id="dob">
        <br><br>

        <button id="submit">Submit</button>

    </form>
    <script src="form.js"></script>
</body>
