<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container">
        <h1>Form Concept bootstrap</h1>
        <form>
            <div class="row">
                <div class="mb-3 col-md-6">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="Email" id="email"/>
                </div>
            
                <div class="mb-3 col-md-6">
                    <label for="pwd" class="form-label">Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        placeholder="Password" 
                        id="pwd"
                    />
                </div>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input 
                    type="text" 
                    class="form-control-lg" 
                    placeholder="address" 
                    id="address"
                />
            </div>

            <div class="mb-3">
                <select class="form-select" aria-label="Default select example">
                    <option selected>choose your city</option>
                    <option value="1">Patna</option>
                    <option value="2">Sitamarhi</option>
                    <option value="3">Delhi</option>
                </select>
            </div>
            
            <h3>By Normal</h3>
            <div class="normal mb-3">
                <input type="checkbox" id="agr">
                <label for="agr">Agree</label>
            </div>

            <h3>By bootstrap</h3>

            <div class="mb-3">
                <input type="checkbox" id="agrees" class="form-check-input">
                <label for="agrees" class="form-check-label">Agree</label>
            </div>

            <div class="mb-3">
                <input type="radio" id="radioes" class="form-check-input">
                <label for="radioes" class="form-check-label">Yes/No</label>
            </div>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
            </div>
        </form>

        <div class="card" style="width: 18rem;">
            <img src="/Assets/myImg.jpeg" class="card-img-top" alt="myImage">
            <div class="card-body">
                <h5 class="card-title">About Me</h5>
                <p class="card-text">My Name is <b>Krishna Yadav.</b></p>
                <p class="card-text">I am Software Enggineering Student.</p>
                <a href="#" class="btn btn-primary">know more</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
