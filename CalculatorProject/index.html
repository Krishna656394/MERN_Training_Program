<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>My Calculator</h2>
        </div>
        <div class="result">
            <input type="text" id="textBox" readonly placeholder="0">
        </div>
        <div class="inputContent">
            <div><button class="item" id="paranStart">(</button></div>
            <div><button class="item" id="paranClose">)</button></div>
            <div><button class="item" id="percent">%</button></div>
            <div><button class="item" id="back">AC</button></div>

            <div><button class="item" id="seven">7</button></div>
            <div><button class="item" id="eight">8</button></div>
            <div><button class="item" id="nine">9</button></div>
            <div><button class="item" id="divi">/</button></div>

            <div><button class="item" id="four">4</button></div>
            <div><button class="item" id="five">5</button></div>
            <div><button class="item" id="six">6</button></div>
            <div><button class="item" id="multi">×</button></div>

            <div><button class="item" id="one">1</button></div>
            <div><button class="item" id="two">2</button></div>
            <div><button class="item" id="three">3</button></div>
            <div><button class="item" id="sub">-</button></div>

            <div><button class="item" id="zero">0</button></div>
            <div><button class="item" id="dot">.</button></div>
            <div><button class="item" id="equal">=</button></div>
            <div><button class="item" id="add">+</button></div>
            
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
